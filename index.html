<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متاهة التعلم المعزز - Cyberpunk RL v2.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <style>
        :root {
            --bg: #050510;
            --surface: #0a0a1a;
            --surface2: #12122a;
            --border: #2a2a4a;
            --text: #e0e0f0;
            --text-secondary: #a0a0c0;
            --accent: #9d4eff;
            --accent-glow: #b87eff;
            --success: #00ffb3;
            --danger: #ff3e6c;
            --warning: #ffb347;
            --agent-color: #00e5ff;
            --goal-color: #ffd700;
            --wall-color: #2a2a40;
            --sensor-color: rgba(0, 229, 255, 0.3);
            --neon-pink: #ff4d8c;
            --neon-blue: #4da6ff;
            --neon-purple: #b84dff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', 'Cairo', 'Orbitron', sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-image: radial-gradient(circle at 20% 30%, rgba(157, 78, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 229, 255, 0.04) 0%, transparent 50%);
        }

        .main-container {
            display: flex;
            gap: 16px;
            padding: 20px;
            max-width: 1300px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .game-panel {
            background: var(--surface);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 0 30px rgba(157, 78, 255, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .game-panel h2 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #b87eff, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 10px rgba(184, 126, 255, 0.3);
        }

        canvas {
            border-radius: 12px;
            border: 2px solid var(--border);
            display: block;
            background: #0a0a18;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(157, 78, 255, 0.15);
        }

        .dashboard {
            background: var(--surface);
            border-radius: 24px;
            padding: 20px 16px;
            border: 1px solid var(--border);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-width: 240px;
            max-width: 300px;
            flex: 1;
        }

        .dashboard h2 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffb347, #ff4d8c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 4px;
        }

        .nn-panel {
            background: var(--surface);
            border-radius: 24px;
            padding: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 0 30px rgba(77, 166, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .nn-panel h3 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #4da6ff, #9d4eff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card {
            background: var(--surface2);
            border-radius: 14px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .stat-card:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(157, 78, 255, 0.2); }
        .stat-label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }
        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            background: rgba(255,255,255,0.04);
            padding: 4px 10px;
            border-radius: 20px;
            min-width: 50px;
            text-align: center;
        }
        .stat-value.highlight { color: var(--accent-glow); text-shadow: 0 0 8px var(--accent); }
        .stat-value.success { color: var(--success); text-shadow: 0 0 8px var(--success); }
        .stat-value.warning { color: var(--warning); text-shadow: 0 0 8px var(--warning); }

        .db-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .db-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
            transition: background 0.3s;
        }
        .db-dot.saved { background: var(--success); box-shadow: 0 0 12px var(--success); }
        .db-dot.loading { background: var(--warning); box-shadow: 0 0 12px var(--warning); animation: pulse 0.8s infinite; }
        .db-dot.error { background: var(--danger); box-shadow: 0 0 12px var(--danger); }
        @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        button {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.25s;
            letter-spacing: 0.5px;
            white-space: nowrap;
            flex: 1;
            min-width: 60px;
            backdrop-filter: blur(5px);
        }
        button:hover {
            background: #1e1e3a;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(157, 78, 255, 0.3);
            transform: translateY(-1px);
        }
        button:active { transform: scale(0.96); }
        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 700;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        button.primary:hover { background: #b87eff; box-shadow: 0 0 25px rgba(157,78,255,0.6); }
        button.danger { border-color: var(--danger); color: var(--danger); }
        button.danger:hover { background: rgba(255,62,108,0.15); border-color: var(--danger); box-shadow: 0 0 15px rgba(255,62,108,0.3); }

        .speed-slider { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--text-secondary); width: 100%; }
        input[type="range"] {
            -webkit-appearance: none; flex: 1; height: 6px; border-radius: 3px; background: var(--border); outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
            cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 10px var(--accent);
        }
        .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.7rem; color: var(--text-secondary); justify-content: center; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; box-shadow: 0 0 8px currentColor; }

        @media (max-width: 950px) {
            .main-container { flex-direction: column; align-items: center; gap: 14px; padding: 10px; }
            .dashboard, .nn-panel { max-width: 100%; width: 100%; min-width: auto; }
            canvas { width: 100%; height: auto; max-width: 420px; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Game Panel -->
        <div class="game-panel">
            <h2>🧠 المتاهة الذكية</h2>
            <canvas id="mazeCanvas" width="480" height="480" aria-label="لعبة المتاهة"></canvas>
            <div class="legend">
                <span class="legend-item"><span class="legend-dot" style="background:var(--agent-color); color:var(--agent-color);">●</span> الوكيل</span>
                <span class="legend-item"><span class="legend-dot" style="background:var(--goal-color); color:var(--goal-color);">●</span> المخرج</span>
                <span class="legend-item"><span class="legend-dot" style="background:var(--neon-pink); color:var(--neon-pink);">●</span> جدار متغير</span>
            </div>
            <div class="btn-group">
                <button id="btnStartStop" class="primary">▶ ابدأ التدريب</button>
                <button id="btnReset" class="danger">↺ إعادة ضبط</button>
            </div>
            <div class="speed-slider">
                <span>🐢</span>
                <input type="range" id="speedSlider" min="1" max="30" value="8" step="1">
                <span>🐇</span>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard">
            <h2>📊 لوحة التحكم</h2>
            <div class="stat-card">
                <span class="stat-label">🔁 المحاولة</span>
                <span class="stat-value highlight" id="episodeNum">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">🏆 إجمالي الجوائز</span>
                <span class="stat-value success" id="totalReward">0.00</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">📉 معدل الخطأ</span>
                <span class="stat-value warning" id="lossValue">---</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">✅ نسبة النجاح</span>
                <span class="stat-value" id="successRate">0%</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">⏱️ الخطوات</span>
                <span class="stat-value" id="stepCount">0</span>
            </div>
            <div class="db-status">
                <span>💾 IndexedDB:</span>
                <span class="db-dot" id="dbDot"></span>
                <span id="dbText">غير محفوظ</span>
            </div>
            <button id="btnSaveWeights">💾 حفظ الأوزان</button>
            <button id="btnLoadWeights">📂 تحميل الأوزان</button>
            <button id="btnClearDB">🗑️ مسح التخزين</button>
        </div>

        <!-- Neural Network Visualizer -->
        <div class="nn-panel">
            <h3>🧬 مراقب الشبكة العصبية</h3>
            <canvas id="nnCanvas" width="280" height="320" aria-label="رسم الشبكة العصبية"></canvas>
        </div>
    </div>

    <script>
        (function() {
            // ==================== CONSTANTS ====================
            const GRID_SIZE = 15;
            const CELL_SIZE = 480 / GRID_SIZE;
            const STATE_DIM = 12;
            const ACTION_DIM = 4;
            const HIDDEN1_UNITS = 500;
            const HIDDEN2_UNITS = 10;
            const DROPOUT_RATE = 0.2;
            const LEARNING_RATE = 0.0005;
            const GAMMA = 0.95;
            const MAX_STEPS_PER_EPISODE = 800;
            const WALL_CHANGE_INTERVAL_MS = 3000;
            const DB_NAME = 'MazeRLModelDB';
            const DB_STORE_NAME = 'model_weights';

            const DIRS = [
                { dr: -1, dc: 0 }, { dr: 1, dc: 0 },
                { dr: 0, dc: -1 }, { dr: 0, dc: 1 }
            ];
            const SENSOR_DIRS = [
                { dr: -1, dc: 0 }, { dr: -1, dc: 1 }, { dr: 0, dc: 1 }, { dr: 1, dc: 1 },
                { dr: 1, dc: 0 }, { dr: 1, dc: -1 }, { dr: 0, dc: -1 }, { dr: -1, dc: -1 }
            ];

            // DOM Elements
            const canvas = document.getElementById('mazeCanvas');
            const ctx = canvas.getContext('2d');
            const nnCanvas = document.getElementById('nnCanvas');
            const nnCtx = nnCanvas.getContext('2d');
            const btnStartStop = document.getElementById('btnStartStop');
            const btnReset = document.getElementById('btnReset');
            const speedSlider = document.getElementById('speedSlider');
            const episodeNumEl = document.getElementById('episodeNum');
            const totalRewardEl = document.getElementById('totalReward');
            const lossValueEl = document.getElementById('lossValue');
            const successRateEl = document.getElementById('successRate');
            const stepCountEl = document.getElementById('stepCount');
            const dbDot = document.getElementById('dbDot');
            const dbText = document.getElementById('dbText');
            const btnSaveWeights = document.getElementById('btnSaveWeights');
            const btnLoadWeights = document.getElementById('btnLoadWeights');
            const btnClearDB = document.getElementById('btnClearDB');

            // State
            let maze = [];
            let agentPos = { r: 0, c: 0 };
            let goalPos = { r: GRID_SIZE-1, c: GRID_SIZE-1 };
            let episodeCount = 0;
            let totalRewardAccum = 0;
            let currentTotalReward = 0;
            let currentSteps = 0;
            let lastLoss = null;
            let successCount = 0;
            let isRunning = false;
            let animationId = null;
            let wallChangeTimer = null;
            let episodeBuffer = [];
            let trainingInProgress = false;
            let dbReady = false;

            let currentActionIndex = -1;
            let currentActivations = {
                dense1: new Array(20).fill(0),
                dense2: new Array(10).fill(0),
                output: new Array(4).fill(0)
            };
            let visUpdateCounter = 0;

            // ==================== INDEXEDDB ====================
            function openDB() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, 1);
                    req.onupgradeneeded = e => {
                        if (!e.target.result.objectStoreNames.contains(DB_STORE_NAME))
                            e.target.result.createObjectStore(DB_STORE_NAME);
                    };
                    req.onsuccess = e => resolve(e.target.result);
                    req.onerror = e => reject(e.target.error);
                });
            }

            async function saveWeightsToDB(model) {
                try {
                    const db = await openDB();
                    const weights = model.getWeights();
                    const weightData = await Promise.all(weights.map(async w => ({
                        data: Array.from(await w.data()),
                        shape: w.shape
                    })));
                    const tx = db.transaction(DB_STORE_NAME, 'readwrite');
                    tx.objectStore(DB_STORE_NAME).put({ weights: weightData, timestamp: Date.now() }, 'latest');
                    await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = reject; });
                    db.close();
                    updateDBStatus('saved', 'محفوظ ✅');
                } catch (err) {
                    console.error('❌ حفظ الأوزان:', err);
                    updateDBStatus('error', 'فشل الحفظ');
                }
            }

            async function loadWeightsFromDB(model) {
                try {
                    const db = await openDB();
                    const tx = db.transaction(DB_STORE_NAME, 'readonly');
                    const store = tx.objectStore(DB_STORE_NAME);
                    const result = await new Promise((resolve, reject) => {
                        const req = store.get('latest');
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                    db.close();
                    if (result && result.weights) {
                        const tensors = result.weights.map(w => tf.tensor(w.data, w.shape));
                        model.setWeights(tensors);
                        tensors.forEach(t => t.dispose());
                        updateDBStatus('saved', 'تم التحميل ✅');
                        return true;
                    } else {
                        updateDBStatus('loading', 'لا يوجد حفظ سابق');
                        return false;
                    }
                } catch (err) {
                    console.error('❌ تحميل الأوزان:', err);
                    updateDBStatus('error', 'فشل التحميل');
                    return false;
                }
            }

            async function clearDB() {
                try {
                    const db = await openDB();
                    const tx = db.transaction(DB_STORE_NAME, 'readwrite');
                    tx.objectStore(DB_STORE_NAME).clear();
                    await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = reject; });
                    db.close();
                    updateDBStatus('loading', 'تم المسح');
                } catch (err) { console.error('فشل مسح DB:', err); }
            }

            function updateDBStatus(status, text) {
                if (!dbDot || !dbText) return;
                dbDot.className = 'db-dot ' + status;
                dbText.textContent = text;
                dbReady = (status === 'saved' || status === 'loading');
            }

            // ==================== NEURAL NETWORK ====================
            function buildModel() {
                const input = tf.input({ shape: [STATE_DIM] });
                const dense1 = tf.layers.dense({ units: HIDDEN1_UNITS, activation: 'relu', kernelInitializer: 'glorotUniform', name: 'dense1' }).apply(input);
                const dropout1 = tf.layers.dropout({ rate: DROPOUT_RATE, name: 'dropout1' }).apply(dense1);
                const dense2 = tf.layers.dense({ units: HIDDEN2_UNITS, activation: 'relu', kernelInitializer: 'glorotUniform', name: 'dense2' }).apply(dropout1);
                const output = tf.layers.dense({ units: ACTION_DIM, activation: 'softmax', kernelInitializer: 'glorotUniform', name: 'output' }).apply(dense2);
                const model = tf.model({ inputs: input, outputs: output });
                model.compile({ optimizer: tf.train.adam(LEARNING_RATE), loss: 'categoricalCrossentropy' });
                return model;
            }

            let model = buildModel();
            let activationModels = createActivationModels();

            function createActivationModels() {
                const dense1Layer = model.getLayer('dense1');
                const dense2Layer = model.getLayer('dense2');
                const outputLayer = model.getLayer('output');
                return {
                    dense1Model: tf.model({ inputs: model.input, outputs: dense1Layer.output }),
                    dense2Model: tf.model({ inputs: model.input, outputs: dense2Layer.output }),
                    outputModel: tf.model({ inputs: model.input, outputs: outputLayer.output })
                };
            }

            async function updateActivations(state) {
                try {
                    const stateTensor = tf.tensor2d([state]);
                    const d1 = activationModels.dense1Model.predict(stateTensor, { verbose: false });
                    const d2 = activationModels.dense2Model.predict(stateTensor, { verbose: false });
                    const out = activationModels.outputModel.predict(stateTensor, { verbose: false });
                    const [d1Data, d2Data, outData] = await Promise.all([d1.data(), d2.data(), out.data()]);
                    for (let i = 0; i < 20; i++) currentActivations.dense1[i] = d1Data[i] || 0;
                    for (let i = 0; i < 10; i++) currentActivations.dense2[i] = d2Data[i] || 0;
                    for (let i = 0; i < 4; i++) currentActivations.output[i] = outData[i] || 0;
                    tf.dispose([stateTensor, d1, d2, out]);
                } catch (e) { /* ignore */ }
            }

            // ==================== MAZE ====================
            function createBaseMaze() {
                const m = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
                for (let r = 0; r < GRID_SIZE; r++) { m[r][0] = 1; m[r][GRID_SIZE - 1] = 1; }
                for (let c = 0; c < GRID_SIZE; c++) { m[0][c] = 1; m[GRID_SIZE - 1][c] = 1; }
                m[0][0] = 0; m[GRID_SIZE - 1][GRID_SIZE - 1] = 0;
                if (GRID_SIZE > 2) {
                    m[0][1] = 0; m[1][0] = 0;
                    m[GRID_SIZE - 1][GRID_SIZE - 2] = 0; m[GRID_SIZE - 2][GRID_SIZE - 1] = 0;
                }
                return m;
            }

            function pathExists(m, sr, sc, er, ec) {
                const visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
                const queue = [{ r: sr, c: sc }];
                visited[sr][sc] = true;
                while (queue.length) {
                    const { r, c } = queue.shift();
                    if (r === er && c === ec) return true;
                    for (const d of DIRS) {
                        const nr = r + d.dr, nc = c + d.dc;
                        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && !visited[nr][nc] && m[nr][nc] === 0) {
                            visited[nr][nc] = true;
                            queue.push({ r: nr, c: nc });
                        }
                    }
                }
                return false;
            }

            function generateRandomInternalWalls(base) {
                const m = base.map(row => [...row]);
                for (let r = 1; r < GRID_SIZE - 1; r++)
                    for (let c = 1; c < GRID_SIZE - 1; c++)
                        if (!(r === 0 && c === 0) && !(r === GRID_SIZE - 1 && c === GRID_SIZE - 1)) m[r][c] = 0;
                m[0][0] = 0; m[GRID_SIZE - 1][GRID_SIZE - 1] = 0;
                if (GRID_SIZE > 2) { m[0][1] = 0; m[1][0] = 0; m[GRID_SIZE - 1][GRID_SIZE - 2] = 0; m[GRID_SIZE - 2][GRID_SIZE - 1] = 0; }
                const density = 0.25 + Math.random() * 0.2;
                for (let r = 1; r < GRID_SIZE - 1; r++)
                    for (let c = 1; c < GRID_SIZE - 1; c++)
                        if ((r !== 0 || c !== 0) && (r !== GRID_SIZE - 1 || c !== GRID_SIZE - 1) && Math.random() < density) m[r][c] = 1;
                m[0][0] = 0; m[GRID_SIZE - 1][GRID_SIZE - 1] = 0;
                if (GRID_SIZE > 2) { m[0][1] = 0; m[1][0] = 0; m[GRID_SIZE - 1][GRID_SIZE - 2] = 0; m[GRID_SIZE - 2][GRID_SIZE - 1] = 0; }
                if (!pathExists(m, 0, 0, GRID_SIZE - 1, GRID_SIZE - 1)) return createGuaranteedPath(m);
                return m;
            }

            function createGuaranteedPath(m) {
                const newM = m.map(r => [...r]);
                let r = 0, c = 0;
                for (let i = 0; i < 500; i++) {
                    if (r === GRID_SIZE - 1 && c === GRID_SIZE - 1) break;
                    newM[r][c] = 0;
                    const choices = [];
                    if (r < GRID_SIZE - 1) choices.push({ dr: 1, dc: 0 });
                    if (c < GRID_SIZE - 1) choices.push({ dr: 0, dc: 1 });
                    if (r > 0) choices.push({ dr: -1, dc: 0 });
                    if (c > 0) choices.push({ dr: 0, dc: -1 });
                    const sel = choices[Math.floor(Math.random() * choices.length)];
                    r = Math.min(Math.max(r + sel.dr, 0), GRID_SIZE - 1);
                    c = Math.min(Math.max(c + sel.dc, 0), GRID_SIZE - 1);
                }
                newM[0][0] = 0; newM[GRID_SIZE - 1][GRID_SIZE - 1] = 0;
                if (GRID_SIZE > 2) { newM[0][1] = 0; newM[1][0] = 0; newM[GRID_SIZE - 1][GRID_SIZE - 2] = 0; newM[GRID_SIZE - 2][GRID_SIZE - 1] = 0; }
                return newM;
            }

            function initializeMaze() {
                const base = createBaseMaze();
                maze = generateRandomInternalWalls(base);
                agentPos = { r: 0, c: 0 };
                goalPos = { r: GRID_SIZE - 1, c: GRID_SIZE - 1 };
            }

            function changeRandomWalls() {
                if (!isRunning) return;
                const base = createBaseMaze();
                maze = generateRandomInternalWalls(base);
                if (maze[agentPos.r][agentPos.c] === 1) {
                    const near = findNearestOpen(agentPos.r, agentPos.c);
                    if (near) { agentPos.r = near.r; agentPos.c = near.c; }
                }
            }

            function findNearestOpen(r, c) {
                const visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
                const queue = [{ r, c }];
                visited[r][c] = true;
                while (queue.length) {
                    const cur = queue.shift();
                    if (maze[cur.r][cur.c] === 0) return { r: cur.r, c: cur.c };
                    for (const d of DIRS) {
                        const nr = cur.r + d.dr, nc = cur.c + d.dc;
                        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && !visited[nr][nc]) {
                            visited[nr][nc] = true;
                            queue.push({ r: nr, c: nc });
                        }
                    }
                }
                return { r: 0, c: 0 };
            }

            function getState() {
                const sensors = SENSOR_DIRS.map(d => {
                    const nr = agentPos.r + d.dr, nc = agentPos.c + d.dc;
                    return (nr < 0 || nr >= GRID_SIZE || nc < 0 || nc >= GRID_SIZE) ? 1.0 : (maze[nr][nc] === 1 ? 1.0 : 0.0);
                });
                return [...sensors, agentPos.r / (GRID_SIZE - 1), agentPos.c / (GRID_SIZE - 1), goalPos.r / (GRID_SIZE - 1), goalPos.c / (GRID_SIZE - 1)];
            }

            function takeAction(actionIdx) {
                const d = DIRS[actionIdx];
                const nr = agentPos.r + d.dr, nc = agentPos.c + d.dc;
                let reward = -0.01, done = false;
                if (nr < 0 || nr >= GRID_SIZE || nc < 0 || nc >= GRID_SIZE || maze[nr][nc] === 1) {
                    reward = -0.1;
                } else {
                    agentPos.r = nr;
                    agentPos.c = nc;
                    if (agentPos.r === goalPos.r && agentPos.c === goalPos.c) { reward = 10.0; done = true; }
                }
                const prevDist = Math.abs(agentPos.r - goalPos.r) + Math.abs(agentPos.c - goalPos.c);
                const actR = (nr < 0 || nr >= GRID_SIZE || nc < 0 || nc >= GRID_SIZE) ? agentPos.r : nr;
                const actC = (nr < 0 || nr >= GRID_SIZE || nc < 0 || nc >= GRID_SIZE) ? agentPos.c : nc;
                const newDist = Math.abs(actR - goalPos.r) + Math.abs(actC - goalPos.c);
                if (newDist < prevDist && !done) reward += 0.05;
                return { reward, done };
            }

            // ==================== TRAINING ====================
            function computeDiscountedRewards(rewards) {
                const disc = new Array(rewards.length).fill(0);
                let cum = 0;
                for (let i = rewards.length - 1; i >= 0; i--) cum = rewards[i] + GAMMA * cum, disc[i] = cum;
                const mean = disc.reduce((a,b) => a + b, 0) / disc.length;
                const std = Math.sqrt(disc.reduce((a,b) => a + (b - mean) ** 2, 0) / disc.length) || 1;
                return disc.map(v => (v - mean) / std);
            }

            async function trainOnEpisode() {
                if (episodeBuffer.length === 0) return;
                trainingInProgress = true;
                const states = episodeBuffer.map(e => e.state);
                const actions = episodeBuffer.map(e => e.action);
                const rewards = episodeBuffer.map(e => e.reward);
                const discRewards = computeDiscountedRewards(rewards);

                const stateTensor = tf.tensor2d(states);
                const discTensor = tf.tensor1d(discRewards);
                const actTensor = tf.tensor1d(actions, 'int32');

                const lossFn = () => tf.tidy(() => {
                    const probs = model.predict(stateTensor, { verbose: false });
                    const masks = tf.oneHot(actTensor, ACTION_DIM);
                    const logProbs = tf.log(probs.add(1e-10));
                    const selected = tf.sum(logProbs.mul(masks), 1);
                    return tf.neg(tf.mean(selected.mul(discTensor)));
                });

                const optimizer = tf.train.adam(LEARNING_RATE);
                const lossValTensor = optimizer.minimize(lossFn);
                lastLoss = lossValTensor.dataSync()[0];
                lossValTensor.dispose();

                tf.dispose([stateTensor, discTensor, actTensor]);
                trainingInProgress = false;
            }

            // ==================== EPISODE LOOP ====================
            async function runEpisode() {
                if (!isRunning) return;
                if (trainingInProgress) { animationId = requestAnimationFrame(runEpisode); return; }

                agentPos = { r: 0, c: 0 };
                currentTotalReward = 0;
                currentSteps = 0;
                episodeBuffer = [];
                let done = false;
                visUpdateCounter = 0;

                while (!done && currentSteps < MAX_STEPS_PER_EPISODE && isRunning) {
                    const state = getState();
                    const probsTensor = model.predict(tf.tensor2d([state]), { verbose: false });
                    const probs = await probsTensor.data();
                    probsTensor.dispose();
                    const actionIdx = sample(probs);
                    currentActionIndex = actionIdx;
                    const { reward, done: stepDone } = takeAction(actionIdx);
                    episodeBuffer.push({ state, action: actionIdx, reward });
                    currentTotalReward += reward;
                    currentSteps++;
                    done = stepDone;

                    if (++visUpdateCounter % 2 === 0 || done) await updateActivations(state);
                    drawMaze();
                    drawNNVisualizer();
                    updateDashboard();

                    const delay = Math.max(10, 200 - parseInt(speedSlider.value) * 15);
                    if (delay > 5 && isRunning) await new Promise(r => setTimeout(r, delay));
                }

                // تحديث الإحصائيات بعد انتهاء المحاولة
                if (done) {
                    successCount++;
                }
                episodeCount++;
                // إضافة المكافأة للإجمالي مرة واحدة فقط
                totalRewardAccum += currentTotalReward;
                
                // حفظ تلقائي بعد الفوز إذا كانت قاعدة البيانات جاهزة
                if (done && dbReady) {
                    saveWeightsToDB(model).catch(console.warn);
                }

                // تدريب النموذج على المحاولة
                await trainOnEpisode();
                
                // تحديث الداشبورد بعد التدريب
                updateDashboard();
                drawMaze();
                drawNNVisualizer();

                if (isRunning) animationId = requestAnimationFrame(runEpisode);
            }

            function sample(probs) {
                let r = Math.random(), cum = 0;
                for (let i = 0; i < probs.length; i++) { cum += probs[i]; if (r <= cum) return i; }
                return probs.length - 1;
            }

            // ==================== RENDERING ====================
            function drawMaze() {
                ctx.clearRect(0, 0, 480, 480);
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        const x = c * CELL_SIZE, y = r * CELL_SIZE;
                        if (maze[r][c] === 1) {
                            ctx.fillStyle = '#1a1a30'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
                            ctx.fillStyle = '#2d2d50'; ctx.fillRect(x+3,y+3,CELL_SIZE-6,CELL_SIZE-6);
                            ctx.shadowColor = '#ff4d8c44'; ctx.shadowBlur = 4;
                            ctx.strokeStyle = '#ff4d8c55'; ctx.lineWidth = 1;
                            ctx.strokeRect(x+2,y+2,CELL_SIZE-4,CELL_SIZE-4);
                            ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
                        } else {
                            ctx.fillStyle = '#0c0c1a'; ctx.fillRect(x+1,y+1,CELL_SIZE-2,CELL_SIZE-2);
                            ctx.fillStyle = '#15152a'; ctx.fillRect(x+2,y+2,CELL_SIZE-4,CELL_SIZE-4);
                        }
                    }
                }
                // sensors glow
                const sensors = SENSOR_DIRS.map(d => {
                    const nr = agentPos.r + d.dr, nc = agentPos.c + d.dc;
                    return (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) ? (maze[nr][nc] === 1 ? 1 : 0) : 1;
                });
                SENSOR_DIRS.forEach((d, i) => {
                    const nr = agentPos.r + d.dr, nc = agentPos.c + d.dc;
                    if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                        const sx = nc * CELL_SIZE, sy = nr * CELL_SIZE;
                        ctx.fillStyle = sensors[i] > 0.5 ? 'rgba(255,77,140,0.25)' : 'rgba(0,229,255,0.15)';
                        ctx.fillRect(sx+2, sy+2, CELL_SIZE-4, CELL_SIZE-4);
                        ctx.strokeStyle = sensors[i] > 0.5 ? '#ff4d8c88' : '#00e5ff44'; ctx.lineWidth = 1;
                        ctx.shadowBlur = 6; ctx.shadowColor = sensors[i] > 0.5 ? '#ff4d8c' : '#00e5ff';
                        ctx.strokeRect(sx+2, sy+2, CELL_SIZE-4, CELL_SIZE-4);
                        ctx.shadowBlur = 0;
                    }
                });
                // goal glow
                const gx = goalPos.c * CELL_SIZE, gy = goalPos.r * CELL_SIZE;
                ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 15;
                const grad = ctx.createRadialGradient(gx+CELL_SIZE/2, gy+CELL_SIZE/2, 4, gx+CELL_SIZE/2, gy+CELL_SIZE/2, CELL_SIZE/2);
                grad.addColorStop(0,'#ffd700'); grad.addColorStop(0.6,'#ff8c00'); grad.addColorStop(1,'#ffd70000');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(gx+CELL_SIZE/2, gy+CELL_SIZE/2, CELL_SIZE/2-2, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff'; ctx.font = 'bold 14px "Segoe UI"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('🏁', gx+CELL_SIZE/2, gy+CELL_SIZE/2);
                // agent glow
                const ax = agentPos.c * CELL_SIZE, ay = agentPos.r * CELL_SIZE;
                ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 20;
                const agrad = ctx.createRadialGradient(ax+CELL_SIZE/2, ay+CELL_SIZE/2, 3, ax+CELL_SIZE/2, ay+CELL_SIZE/2, CELL_SIZE/2);
                agrad.addColorStop(0,'#fff'); agrad.addColorStop(0.3,'#00e5ff'); agrad.addColorStop(1,'#00668000');
                ctx.fillStyle = agrad;
                ctx.beginPath(); ctx.arc(ax+CELL_SIZE/2, ay+CELL_SIZE/2, CELL_SIZE/2-3, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#000'; ctx.font = 'bold 16px "Segoe UI"'; ctx.fillText('🤖', ax+CELL_SIZE/2, ay+CELL_SIZE/2);
                // grid
                ctx.strokeStyle = '#2a2a4a22'; ctx.lineWidth = 0.5;
                for (let i = 0; i <= GRID_SIZE; i++) {
                    ctx.beginPath(); ctx.moveTo(i*CELL_SIZE, 0); ctx.lineTo(i*CELL_SIZE, 480); ctx.stroke();
                    ctx.moveTo(0, i*CELL_SIZE); ctx.lineTo(480, i*CELL_SIZE); ctx.stroke();
                }
            }

            function drawNNVisualizer() {
                const w = nnCanvas.width, h = nnCanvas.height;
                nnCtx.clearRect(0,0,w,h);
                nnCtx.fillStyle = '#0a0a1a'; nnCtx.fillRect(0,0,w,h);
                const layers = [
                    { x:30, label:'مدخلات', size:8, count:12 },
                    { x:90, label:'H1 (500) عينة', size:5, count:20 },
                    { x:150, label:'H2 (10)', size:7, count:10 },
                    { x:210, label:'مخرجات', size:9, count:4 }
                ];
                const centerY = h/2, spacingY = 20;
                nnCtx.strokeStyle = '#2a2a4a44'; nnCtx.lineWidth = 0.5;
                for (let i=0; i<layers.length-1; i++) {
                    for (let j=0; j<layers[i].count; j++) {
                        const y1 = centerY - (layers[i].count*spacingY)/2 + j*spacingY + spacingY/2;
                        for (let k=0; k<layers[i+1].count; k++) {
                            const y2 = centerY - (layers[i+1].count*spacingY)/2 + k*spacingY + spacingY/2;
                            nnCtx.beginPath();
                            nnCtx.moveTo(layers[i].x+layers[i].size, y1);
                            nnCtx.lineTo(layers[i+1].x-layers[i+1].size, y2);
                            nnCtx.stroke();
                        }
                    }
                }
                const values = [ getState(), currentActivations.dense1, currentActivations.dense2, currentActivations.output ];
                layers.forEach((layer, idx) => {
                    const vals = values[idx] || new Array(layer.count).fill(0);
                    for (let j=0; j<layer.count; j++) {
                        const y = centerY - (layer.count*spacingY)/2 + j*spacingY + spacingY/2;
                        const intensity = Math.min(1, Math.abs(vals[j]||0));
                        let color;
                        if (idx===3 && currentActionIndex===j) {
                            color = '#ff4d8c'; nnCtx.shadowColor = '#ff4d8c'; nnCtx.shadowBlur = 12;
                        } else {
                            color = `rgb(${100+intensity*155},${100+intensity*100},${200+intensity*55})`;
                            nnCtx.shadowColor = 'transparent'; nnCtx.shadowBlur = 0;
                        }
                        nnCtx.fillStyle = color;
                        nnCtx.beginPath(); nnCtx.arc(layer.x, y, layer.size, 0, Math.PI*2); nnCtx.fill();
                        nnCtx.strokeStyle = '#ffffff33'; nnCtx.lineWidth = 0.8; nnCtx.stroke();
                    }
                    nnCtx.shadowBlur = 0;
                    nnCtx.fillStyle = '#a0a0c0'; nnCtx.font = '8px "Segoe UI"'; nnCtx.textAlign = 'center';
                    nnCtx.fillText(layer.label, layer.x, h-5);
                });
                if (currentActionIndex >= 0) {
                    const outLayer = layers[3];
                    const y = centerY - (outLayer.count*spacingY)/2 + currentActionIndex*spacingY + spacingY/2;
                    nnCtx.shadowColor = '#ff4d8c'; nnCtx.shadowBlur = 10;
                    nnCtx.fillStyle = '#ff4d8c';
                    nnCtx.beginPath();
                    nnCtx.moveTo(outLayer.x+25, y-6); nnCtx.lineTo(outLayer.x+37, y); nnCtx.lineTo(outLayer.x+25, y+6);
                    nnCtx.fill();
                }
                nnCtx.shadowBlur = 0;
            }

            function updateDashboard() {
                if (!episodeNumEl || !totalRewardEl || !lossValueEl || !successRateEl || !stepCountEl) return;
                episodeNumEl.textContent = episodeCount;
                totalRewardEl.textContent = totalRewardAccum.toFixed(2);
                lossValueEl.textContent = lastLoss !== null ? lastLoss.toFixed(4) : '---';
                successRateEl.textContent = episodeCount > 0 ? ((successCount / episodeCount) * 100).toFixed(1) + '%' : '0.0%';
                stepCountEl.textContent = currentSteps;
                drawNNVisualizer();
            }

            // ==================== CONTROL ====================
            function startTraining() {
                if (isRunning) return;
                isRunning = true;
                btnStartStop.textContent = '⏸️ إيقاف';
                btnStartStop.classList.replace('primary', 'danger');
                wallChangeTimer = setInterval(changeRandomWalls, WALL_CHANGE_INTERVAL_MS);
                runEpisode();
            }

            function stopTraining() {
                isRunning = false;
                btnStartStop.textContent = '▶ ابدأ التدريب';
                btnStartStop.classList.replace('danger', 'primary');
                if (wallChangeTimer) { clearInterval(wallChangeTimer); wallChangeTimer = null; }
                if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            }

            async function resetAll() {
                stopTraining();
                episodeCount = 0;
                totalRewardAccum = 0;
                currentTotalReward = 0;
                currentSteps = 0;
                lastLoss = null;
                successCount = 0;
                episodeBuffer = [];
                currentActionIndex = -1;
                currentActivations = { dense1: new Array(20).fill(0), dense2: new Array(10).fill(0), output: new Array(4).fill(0) };
                model.dispose();
                model = buildModel();
                activationModels = createActivationModels();
                initializeMaze();
                agentPos = { r: 0, c: 0 };
                updateDashboard();
                drawMaze();
                drawNNVisualizer();
                updateDBStatus('loading', 'نموذج جديد');
            }

            btnStartStop.addEventListener('click', () => isRunning ? stopTraining() : startTraining());
            btnReset.addEventListener('click', resetAll);
            btnSaveWeights.addEventListener('click', () => saveWeightsToDB(model));
            btnLoadWeights.addEventListener('click', async () => { await loadWeightsFromDB(model); updateDashboard(); });
            btnClearDB.addEventListener('click', async () => { await clearDB(); updateDBStatus('loading', 'تم المسح'); });

            // ==================== START ====================
            async function init() {
                initializeMaze();
                drawMaze();
                drawNNVisualizer();
                updateDashboard();
                updateDBStatus('loading', 'جاري التحقق...');
                if (!await loadWeightsFromDB(model)) updateDBStatus('loading', 'نموذج جديد');
            }
            init().catch(err => { console.error('Initialization error:', err); updateDBStatus('error', 'خطأ في التهيئة'); });
        })();
    </script>
